
name: APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROSE AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          echo "Searching for project ZIP files..."

          mkdir -p .roseai-extracted

          found=0

          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -oq "$zipfile" -d .roseai-extracted
            found=1
          done < <(
            find . -maxdepth 1 -type f -iname '*.zip' \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No ZIP found. Checking existing repository files."
          fi

          echo "Extraction completed."

      - name: Locate Complete Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")

            if { [ -f "$dir/app/build.gradle" ] || \
                 [ -f "$dir/app/build.gradle.kts" ]; } && \
               [ -f "$dir/app/src/main/AndroidManifest.xml" ]; then

              PROJECT_DIR="$dir"
              break
            fi

          done < <(
            find . \
              -type d \( -name .git -o -name .github -o -name .gradle \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Complete Android project not found."
            echo "Searching for app files..."
            find . -type f \( \
              -name build.gradle -o \
              -name build.gradle.kts -o \
              -name AndroidManifest.xml \
            \) | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain

          elif [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::Gradle wrapper JAR exists but gradlew is missing."
            exit 1

          else
            echo "Gradle wrapper not found. Using Gradle 8.10.2."
            gradle --version
            gradle assembleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain
          fi

      - name: Find Generated APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' 2>/dev/null | head -1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload ROSE AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Collect Build Error Reports
        if: failure()
        shell: bash
        run: |
          mkdir -p build-error-logs

          PROJECT="${{ steps.project.outputs.project_dir }}"

          if [ -d "$PROJECT/app/build/reports" ]; then
            cp -r "$PROJECT/app/build/reports" \
              build-error-logs/
          fi

          if [ -d "$PROJECT/build/reports" ]; then
            cp -r "$PROJECT/build/reports" \
              build-error-logs/root-reports
          fi

          echo "Build error reports collected."

      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-build-error-logs
          path: build-error-logs/
          if-no-files-found: ignore
          retention-days: 7
          
