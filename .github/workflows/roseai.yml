
name: APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROSE AI debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Android project structure
        shell: bash
        run: |
          fail=0

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Gradle settings found"
          else
            echo "::error::Missing settings.gradle"
            fail=1
          fi

          if [ -d app ]; then
            echo "Found app directory"
          else
            echo "::error::app directory is missing"
            fail=1
          fi

          if [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            echo "Found app Gradle file"
          else
            echo "::error::Missing app Gradle file"
            fail=1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "Found AndroidManifest.xml"
          else
            echo "::error::AndroidManifest.xml is missing"
            fail=1
          fi

          if [ -f gradlew ]; then
            echo "Found Gradle wrapper"
          else
            echo "::error::gradlew is missing"
            fail=1
          fi

          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Found Gradle wrapper JAR"
          else
            echo "::error::gradle-wrapper.jar is missing"
            fail=1
          fi

          exit $fail

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      - name: Locate generated APK
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n 1)

          if [ -z "$apk" ]; then
            echo "::error::Debug APK was not generated"
            exit 1
          fi

          echo "APK generated: $apk"
          ls -lh "$apk"

      - name: Upload ROSE-AI-APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Collect build error logs
        if: failure()
        shell: bash
        run: |
          mkdir -p build-error-logs

          if [ -d app/build/reports ]; then
            cp -r app/build/reports build-error-logs/
          fi

          find . -path ./.git -prune -o -name '*.log' -print \
            -exec cp --parents {} build-error-logs/ \; 2>/dev/null || true

      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-build-error-logs
          path: build-error-logs/**
          if-no-files-found: ignore
          retention-days: 7
          
