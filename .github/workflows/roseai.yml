
name: APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROSE AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir=$(dirname "$file")

            if [ -d "$dir/app" ] && \
              { [ -f "$dir/app/build.gradle" ] || [ -f "$dir/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found. A settings file and app Gradle file in the same directory are required."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon --console=plain
          else
            echo "Gradle wrapper not found. Using installed Gradle."
            gradle assembleDebug --stacktrace --no-daemon --console=plain
          fi

      - name: Find Generated APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' 2>/dev/null | head -1)

          if [ -z "$APK" ]; then
            echo "::error::No APK generated. Check the Gradle build output."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload ROSE AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Collect Build Reports
        if: failure()
        shell: bash
        run: |
          mkdir -p build-error-logs

          PROJECT="${{ steps.project.outputs.project_dir }}"

          if [ -d "$PROJECT/app/build/reports" ]; then
            cp -r "$PROJECT/app/build/reports" build-error-logs/
          fi

          if [ -d "$PROJECT/build/reports" ]; then
            cp -r "$PROJECT/build/reports" build-error-logs/root-reports
          fi

          echo "Build reports collected."

      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-build-error-logs
          path: build-error-logs/
          if-no-files-found: ignore
          retention-days: 7
