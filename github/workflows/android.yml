name: Android Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROSE AI debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Android project structure
        shell: bash
        run: |
          fail=0

          if [ -f settings.gradle ]; then
            echo "Found settings.gradle (Groovy DSL)"
          elif [ -f settings.gradle.kts ]; then
            echo "Found settings.gradle.kts (Kotlin DSL)"
          else
            echo "::error file=settings.gradle::Neither settings.gradle nor settings.gradle.kts exists at the repository root."
            fail=1
          fi

          if [ -d app ]; then
            echo "Found app/ directory"
          else
            echo "::error::app/ directory is missing at the repository root."
            fail=1
          fi

          if [ -f app/build.gradle ]; then
            echo "Found app/build.gradle (Groovy DSL)"
          elif [ -f app/build.gradle.kts ]; then
            echo "Found app/build.gradle.kts (Kotlin DSL)"
          else
            echo "::error::Neither app/build.gradle nor app/build.gradle.kts exists."
            fail=1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "Found AndroidManifest.xml"
          else
            echo "::error::app/src/main/AndroidManifest.xml is missing."
            fail=1
          fi

          if [ -f gradlew ]; then
            echo "Found Gradle wrapper (gradlew)"
          else
            echo "::error::gradlew is missing. Commit the Gradle wrapper files (gradlew, gradlew.bat, gradle/wrapper/)."
            fail=1
          fi

          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Found gradle-wrapper.jar"
          else
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing."
            fail=1
          fi

          exit $fail

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      - name: Locate generated debug APK
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug finished but no debug APK was found in app/build/outputs/apk/debug/."
            exit 1
          fi
          echo "Generated APK: $apk"
          ls -lh "$apk"

      - name: Upload ROSE-AI-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Collect error logs after a failed build
        if: failure()
        shell: bash
        run: |
          mkdir -p build-error-logs
          if [ -d app/build/reports ]; then
            cp -r app/build/reports build-error-logs/
          fi
          find . -path ./.git -prune -o -name '*.log' -print -exec cp --parents {} build-error-logs/ \; 2>/dev/null || true
          echo "Collected logs:"
          find build-error-logs -type f | head -n 100 || true

      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ROSE-AI-build-error-logs
          path: build-error-logs/**
          if-no-files-found: ignore
          retention-days: 7
